# dsh-mobile-theme bundle patch: one client roster row.
#
# The row's package declares `dsh.client` (platform: web), so the
# client-modules node half scans it into window.__DSH_BOOT__ and serves
# its `exports["./client"]` bundle to the browser. The node half of the
# package is a no-op apply — the host Loader still gives this entry a
# fiber, which the web plugin scan requires before it composes the row.
#
# The browser entry declares theme/layout services; its package metadata
# declares the corresponding client graph dependencies. Right-sidebar
# actions are read opportunistically from their owning service.
- insert:
    - id: mobile-theme
      name: dsh-mobile-theme
